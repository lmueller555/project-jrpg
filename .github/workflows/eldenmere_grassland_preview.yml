name: Eldenmere grassland preview CI
on:
  push:
    branches: [feat/eldenmere-blob47-preview]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt Pillow pytest
      - run: python -m pytest tests/test_grassland_blob47.py tests/test_eldenmere_ground.py tests/test_grassland_autotile.py -q
      - name: Capture actual Pygame comparison screens
        run: python -m tools.terrain.capture_eldenmere_preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldenmere-grassland-pygame-screenshots
          path: artifacts/eldenmere_grassland/*.png
          if-no-files-found: warn
