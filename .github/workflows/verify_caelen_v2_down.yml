name: Verify Caelen V2 down production atlas
on:
  push:
    branches: [feat/caelen-v2-down-staging]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow pytest
      - run: python -m pytest tests/test_caelen_v2_down_final.py tests/test_caelen_v2_down_prototype.py -q
