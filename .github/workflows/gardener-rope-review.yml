name: Render gardener rope review
on:
  push:
    branches: [gardener-near-side-well-review]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pygame and preview dependencies
        run: python -m pip install -r requirements.txt Pillow
      - name: Rebuild well art and playable map
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python tools/build_well_drawing.py
          python tools/build_playable_eldenmere.py
      - name: Test revised well animation and gardener
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v
      - name: Capture actual game animation
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/capture_gardener_well.py
      - name: Commit regenerated game art and GIF previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/source/terrain/eldenmere/well assets/terrain/eldenmere/well assets/source/characters/npcs/female_02/gardener assets/characters/npcs/female_02/gardener docs/reviews/gardener_near_side assets/maps/eldenmere
          if ! git diff --cached --quiet; then
            git commit -m "assets: render updated gardener well rope animation previews"
            git push
          fi
