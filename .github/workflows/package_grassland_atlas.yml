name: Package grassland atlas
on:
  push:
    branches:
      - feat/grassland-atlas-packaging
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow pytest
      - run: python -m pytest tests/test_grassland_atlas.py -q
      - name: Commit generated PNG to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/atlases/terrain/grassland_v1.png
          if ! git diff --cached --quiet; then
            git commit -m "build: package 63 grassland source slots into RGBA atlas"
            git push
          fi
